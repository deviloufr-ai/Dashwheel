name: Google Play bundle

# The Google Play build of the launcher: the "play" flavour, as the app bundle
# the Play Console takes (and an APK of the same build for trying it on a
# unit). Separate from the GitHub release (build.yml): a Play app may not
# update itself from GitHub nor link a donation page, and it sells Dashwheel
# Pro instead (Premium.kt, src/play). Run by hand, then upload the .aab in
# the Play Console (Release → Production / Testing → Create new release).
#
# Signing: Play App Signing holds the app's key; the bundle is signed with the
# upload key. Enrol the existing release key as the app signing key and use
# it as the upload key too, and the Play build has the same signature as the
# GitHub APK, so either installs over the other. The PLAY_* secrets are for a
# separate upload key; unset, the release key's secrets are used.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build the Play bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Same pinned actions as build.yml (the tag each commit was taken from is in the comment).
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Prepare upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "Upload keystore prepared."
          else
            echo "::error::No PLAY_KEYSTORE_BASE64 (nor KEYSTORE_BASE64) secret set: the Play Console only takes a signed bundle."
            exit 1
          fi

      # The version code must grow with every bundle uploaded to Play: this
      # workflow's own run number does. It is its own sequence, apart from the
      # GitHub releases' (build.yml): Play never sees those.
      - name: Build Play bundle and APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundlePlayRelease :app:assemblePlayRelease --stacktrace

      - name: Name outputs
        run: |
          cp app/build/outputs/bundle/playRelease/app-play-release.aab Dashwheel-play-1.0.${{ github.run_number }}.aab
          cp app/build/outputs/apk/play/release/app-play-release.apk Dashwheel-play-1.0.${{ github.run_number }}.apk

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashwheel-play
          path: |
            Dashwheel-play-1.0.${{ github.run_number }}.aab
            Dashwheel-play-1.0.${{ github.run_number }}.apk
          if-no-files-found: error

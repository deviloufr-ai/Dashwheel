name: Second screen card image

# The ready-made SD card for the Raspberry Pi second screen (tools/pi/build-image.sh),
# published to the "second-screen-image" pre-release under a name that never
# changes, so the README can link to it. Pre-release: the app and companion
# updaters read only the latest full release, never this one.
on:
  push:
    branches: [ main ]
    paths:
      - 'display/**'
      - 'link/**'
      - 'tools/pi/**'
      - '.github/workflows/pi-image.yml'
  workflow_dispatch:

permissions:
  contents: write

# A newer push makes the running build pointless.
concurrency:
  group: pi-image
  cancel-in-progress: true

jobs:
  program:
    name: Build the display program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - run: ./gradlew :display:installDist --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dashwheel-display
          path: display/build/install/dashwheel-display
          if-no-files-found: error

  image:
    name: Build the card image
    needs: program
    # The installer runs inside the image: an arm64 machine runs it natively.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dashwheel-display
          path: dashwheel-display

      - name: Build the image
        run: |
          # Artifacts lose the executable bit.
          chmod +x dashwheel-display/bin/*
          sudo bash tools/pi/build-image.sh dashwheel-display dashwheel-second-screen.img.xz
          sha256sum dashwheel-second-screen.img.xz > dashwheel-second-screen.img.xz.sha256
          echo "BASE=$(curl -fsI https://downloads.raspberrypi.com/raspios_lite_arm64_latest | sed -n 's/^location: .*\/\([^/]*\)\.img\.xz.*/\1/Ip' | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: second-screen-image
          name: Second screen card (Raspberry Pi)
          prerelease: true
          files: |
            dashwheel-second-screen.img.xz
            dashwheel-second-screen.img.xz.sha256
          body: |
            Ready-made SD card for the Dashwheel second screen on a Raspberry Pi 3 or newer.
            Write **dashwheel-second-screen.img.xz** with Raspberry Pi Imager (*Use custom*), then
            write the phone's hotspot in `dashwheel/wifi.txt` on the card. Steps: [tools/pi/README.md](https://github.com/${{ github.repository }}/blob/main/tools/pi/README.md).

            Built ${{ github.event.head_commit.timestamp || github.run_started_at }} from ${{ github.sha }}, on ${{ env.BASE }}.

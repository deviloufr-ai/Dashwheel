name: Promote to stable

# Makes a beta (a pre-release built from main by build.yml) the stable release:
# the same signed APK, now GitHub's "latest" release, which every driver on the
# stable channel and the phone companion's updater read. Run it by hand from
# the Actions tab once a beta has been driven with.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Beta to promote, e.g. v1.0.712. Empty: the newest beta.'
        required: false
        default: ''

permissions:
  contents: write

# Two promotions at once would race for "latest".
concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote a beta to stable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          # [.] rather than \. : jq rejects "\." inside its strings, grep -E reads both the same.
          main_tag='^v[0-9]+[.][0-9]+[.][0-9]+$'
          tag="$TAG_INPUT"
          if [ -z "$tag" ]; then
            tag=$(gh release list --limit 100 --json tagName,isPrerelease,isDraft,createdAt \
              --jq "[.[] | select(.isPrerelease and (.isDraft | not) and (.tagName | test(\"$main_tag\")))] | sort_by(.createdAt) | last | .tagName // empty")
          fi
          if [ -z "$tag" ]; then echo "::error::No beta to promote."; exit 1; fi
          if ! echo "$tag" | grep -Eq "$main_tag"; then echo "::error::$tag is not a build of main."; exit 1; fi
          if [ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" != "true" ]; then
            echo "::error::$tag is already stable."; exit 1
          fi

          # The current stable, to list everything since it and to never go backwards.
          prev=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$prev" ] && [ "${tag##*.}" -le "${prev##*.}" ]; then
            echo "::error::$tag is not newer than the current stable $prev."; exit 1
          fi

          {
            echo "## What's new in $tag"
            echo
            git log ${prev:+$prev..}"$tag" --no-merges -n 80 --format='### %s%n%n%b' \
              | sed -e '/^Co-Authored-By:/d' -e '/^Signed-off-by:/d' -e '/^Claude-Session:/Id'
            if [ -n "$prev" ]; then
              echo
              echo "_Changes since ${prev}._"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

          gh release edit "$tag" --prerelease=false --latest --title "Dashwheel $tag" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Promoted $tag to stable (was ${prev:-none})."

  # The betas the new stable has overtaken can no longer be offered to anyone.
  prune:
    name: Prune old betas
    needs: promote
    uses: ./.github/workflows/prune-betas.yml
    permissions:
      contents: write

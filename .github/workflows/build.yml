name: Build Android APK

on:
  push:
    # main publishes a release the in-app updater picks up; any other branch
    # publishes a *pre-release* (ignored by the updater) for trying a branch on
    # the head unit without merging it.
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Needed so the build can publish a GitHub Release with the APK.
permissions:
  contents: write

jobs:
  build:
    name: Assemble & release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history and tags so the release notes can list every commit
          # since the previous release.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's default ("tools platform-tools"); the obsolete
          # "tools" package was removed from the SDK repo and breaks the step.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # The committed wrapper pins Gradle 8.13 with a verified checksum; do not
      # regenerate it here, that would silently drop the verification.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "Release keystore prepared."
          else
            echo "::error::No KEYSTORE_BASE64 secret set. A debug-signed release could never be"
            echo "::error::updated in place, so the build stops here (Gradle enforces this too)."
            exit 1
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # The launcher ships as Dashwheel-<version>.apk (the in-app updater takes
      # any .apk but the companion). The phone companion app ships in the same
      # release, under the name the launcher's pairing screen links to (and its
      # updater skips).
      - name: Name APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk Dashwheel-1.0.${{ github.run_number }}.apk
          cp companion/build/outputs/apk/release/companion-release.apk dashwheel-companion.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openauto-dash-apk
          path: |
            Dashwheel-1.0.${{ github.run_number }}.apk
            dashwheel-companion.apk
          if-no-files-found: error

      # Readable changelog: one section per commit since the previous release,
      # using the commit subject as the heading and its body as the details.
      # Commit bodies are written as user-facing notes, so this reads as a
      # changelog rather than a bare "Full Changelog" link.
      - name: Write release notes
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          # Only main's own tags: a branch pre-release tag is not a release.
          prev=$(git describe --tags --abbrev=0 --match 'v1.0.*' HEAD^ 2>/dev/null || true)
          range=${prev:+$prev..HEAD}
          {
            echo "## What's new in v1.0.${{ github.run_number }}"
            echo
            git log $range --no-merges -n 30 --format='### %s%n%n%b' \
              | sed -e '/^Co-Authored-By:/d' -e '/^Signed-off-by:/d' -e '/^Claude-Session:/Id'
            if [ -n "$prev" ]; then
              echo
              echo "_Changes since ${prev}._"
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dashwheel v1.0.${{ github.run_number }}
          files: |
            Dashwheel-1.0.${{ github.run_number }}.apk
            dashwheel-companion.apk
          body_path: ${{ runner.temp }}/release-notes.md

      - name: Publish branch pre-release
        if: ${{ github.ref != 'refs/heads/main' && github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-v1.0.${{ github.run_number }}
          name: Dashwheel v1.0.${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          files: |
            Dashwheel-1.0.${{ github.run_number }}.apk
            dashwheel-companion.apk
          body: |
            Test build of branch `${{ github.ref_name }}` at ${{ github.sha }}.
            Signed with the release key, so it installs over the current version; a later
            release from main will update over it again. The in-app updater ignores pre-releases.
